body{margin:0}

</style>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1150}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'today', sheet: false, newTitle: '', when: 0, rem: true,
      tasks: [
        { id: 't3', title: 'Reply to Sam about dinner', due: 'Today 6:00 PM', when: 'today', cat: 'Personal', p: 'med', reminder: true, done: false },
        { id: 't4', title: 'Pay electricity bill', due: 'Today', when: 'today', cat: 'Home · from email', p: 'med', reminder: false, done: false },
        { id: 't5', title: 'Call Mom', due: 'Today 8:00 PM', when: 'today', cat: 'Personal', p: 'low', reminder: true, done: false },
        { id: 't1', title: 'Submit Q3 report', due: 'Tomorrow 9:00 AM', when: 'upcoming', cat: 'Work', p: 'high', reminder: true, done: false },
        { id: 't2', title: 'Prep design review slides', due: 'Tomorrow 10:00 AM', when: 'upcoming', cat: 'Work', p: 'high', reminder: false, done: false },
        { id: 't6', title: 'Plan the week', due: 'Sun 7:00 PM', when: 'upcoming', cat: 'Routine', p: 'low', reminder: true, repeat: true, done: false },
        { id: 't7', title: 'Book dentist appointment', due: 'Done yesterday', when: 'today', cat: 'Personal', p: 'low', reminder: false, done: true }
      ]
    };
  }
  renderVals() {
    const st = this.state;
    const pr = { high: ['High', '#DD6B78', '#B23A4A'], med: ['Medium', '#E8AD59', '#8A5A12'], low: ['Low', '#9DAAE6', '#2E3A78'] };
    const show = st.tasks.filter((t) => {
      if (st.tab === 'completed') return t.done;
      if (st.tab === 'all') return true;
      return !t.done && t.when === st.tab;
    });
    const whens = ['Today', 'Tomorrow', 'Next week'];
    const pill = (sel) => ({ sel: sel ? 'true' : 'false', bg: sel ? 'rgba(222,228,250,0.85)' : '#FFFFFF', fg: sel ? '#232C5E' : '#1C2140', border: sel ? '1.5px solid #6A79CF' : '1px solid rgba(255,255,255,0.8)' });
    return {
      tabs: [['today', 'Today'], ['upcoming', 'Upcoming'], ['completed', 'Done'], ['all', 'All']].map(([id, label]) => {
        const sel = st.tab === id;
        return { label, sel: sel ? 'true' : 'false', bg: sel ? '#1C2140' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#1C2140', border: sel ? '1px solid #1C2140' : '1px solid rgba(255,255,255,0.8)', pick: () => this.setState({ tab: id }) };
      }),
      empty: show.length === 0,
      tasks: show.map((t) => Object.assign({}, t, {
        priority: pr[t.p][0], pColor: pr[t.p][1], pText: pr[t.p][2],
        doneStr: t.done ? 'true' : 'false',
        boxBg: t.done ? '#34A889' : '#FFFFFF', boxBorder: t.done ? '0' : '2px solid #BCC6EA',
        strike: t.done ? 'line-through' : 'none', titleColor: t.done ? '#515A7A' : '#1C2140',
        dueColor: t.due.indexOf('Today') === 0 ? '#2E3A78' : '#343B5C',
        repeat: !!t.repeat,
        toggle: () => this.setState({ tasks: st.tasks.map((x) => (x.id === t.id ? Object.assign({}, x, { done: !x.done }) : x)) }),
        remove: () => this.setState({ tasks: st.tasks.filter((x) => x.id !== t.id) })
      })),
      sheet: st.sheet, newTitle: st.newTitle,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      setTitle: (e) => this.setState({ newTitle: e.target.value }),
      whens: whens.map((l, i) => Object.assign({ label: l, pick: () => this.setState({ when: i }) }, pill(i === st.when))),
      remStr: st.rem ? 'true' : 'false', remTrack: st.rem ? '#2E3A78' : '#B9C0D6', remAlign: st.rem ? 'flex-end' : 'flex-start',
      toggleRem: () => this.setState({ rem: !st.rem }),
      addTask: () => {
        const title = st.newTitle.trim();
        if (!title) return;
        const t = { id: 'n' + Date.now(), title, due: whens[st.when], when: st.when === 0 ? 'today' : 'upcoming', cat: 'Personal', p: 'med', reminder: st.rem, done: false };
        this.setState({ tasks: [t].concat(st.tasks), sheet: false, newTitle: '', tab: t.when });
      }
    };
  }
}
</script>
