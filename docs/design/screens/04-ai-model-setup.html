<style>
body{margin:0}
a{color:#2E3A78;text-decoration:none}a:hover{color:#232C5E}
button{font-family:inherit;cursor:pointer}
@keyframes mira-spin{to{transform:rotate(360deg)}}
@keyframes mira-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.mira-spin{animation:mira-spin 6s linear infinite}
.mira-breathe{animation:mira-breathe 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.mira-spin,.mira-breathe{animation:none}}
.m-breathe{animation:m-breathe 4s ease-in-out infinite}
@keyframes m-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
.m-blink{animation:m-blink 15s linear infinite}
@keyframes m-blink{0%,28.6%,30%,62.4%,63.8%,98.6%,100%{transform:scaleY(1)}29.3%,63.1%,99.3%{transform:scaleY(0.08)}}
.m-swell{animation:m-swell 3.2s ease-in-out infinite}
@keyframes m-swell{0%{transform:scale(1)}8%{transform:scale(1.025)}16%{transform:scale(1.012)}26%{transform:scale(1.04)}36%{transform:scale(1.018)}46%{transform:scale(1.034)}56%{transform:scale(1.01)}64%{transform:scale(1.028)}74%,100%{transform:scale(1)}}
.m-lvl{animation:m-lvl 3.2s ease-in-out infinite;transform-origin:50% 50%}
@keyframes m-lvl{0%{transform:scaleY(.25)}8%{transform:scaleY(.7)}16%{transform:scaleY(.45)}26%{transform:scaleY(1)}36%{transform:scaleY(.5)}46%{transform:scaleY(.85)}56%{transform:scaleY(.35)}64%{transform:scaleY(.75)}74%,100%{transform:scaleY(.18)}}
.m-scan{animation:m-scan 1.5s ease-in-out infinite alternate}
@keyframes m-scan{from{transform:translateX(0)}to{transform:translateX(14px)}}
.m-tilt{animation:m-tilt 1.5s ease-in-out infinite alternate}
@keyframes m-tilt{from{transform:rotate(0deg)}to{transform:rotate(3deg)}}
.m-nod{animation:m-nod 6s ease-out infinite}
@keyframes m-nod{0%,3.3%{transform:translateY(0) rotate(0deg)}5.4%{transform:translateY(1.9%) rotate(1.5deg)}7.5%,100%{transform:translateY(0) rotate(0deg)}}
@media (prefers-reduced-motion: reduce){.m-breathe,.m-blink,.m-swell,.m-lvl,.m-scan,.m-tilt,.m-nod{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 20px; font-family: 'Onest', 'Segoe UI', system-ui, sans-serif; color: #1C2140; background: linear-gradient(180deg, #A7B2CE 0%, #C3CBDF 30%, #DCE0EC 62%, #E9ECF3 100%); isolation: isolate">

    <div style="position: absolute; width: 260px; height: 640px; right: -40px; top: -180px; border-radius: 50%; background: linear-gradient(100deg, rgba(255,255,255,0) 18%, rgba(255,255,255,0.9) 47%, rgba(255,255,255,0) 72%); filter: blur(16px); transform: rotate(28deg)"></div>

  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Setup.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); color: #1C2140; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></a>

      <div style="height: 6px; border-radius: 999px; background: #2E3A78"></div>
      <div style="height: 6px; border-radius: 999px; background: #2E3A78"></div>
      <div style="height: 6px; border-radius: 999px; background: #CDD4EB"></div>
    </div>
  </div>

  <div style="background: rgba(255,255,255,0.46); backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); border: 1px solid rgba(255,255,255,0.78); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 10px 30px rgba(40,52,100,0.08); border-radius: 28px; padding: 24px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 16px 40px rgba(28,33,64,0.06)">
    <div style="position: relative; width: 112px; height: 112px; display: flex; align-items: center; justify-content: center">

      <dc-import name="Mira-lbou" mode="{{orbMode}}" size="84" theme="light" hint-size="84px,101px"></dc-import>
      <div style="position: absolute; right: 2px; bottom: 6px; width: 30px; height: 30px; border-radius: 10px; background: #1C2140; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 3px solid #FFFFFF"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"></rect></svg></div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <h1 style="margin: 0; font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em">Your AI runs on this device</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #465071; max-width: 290px">Private, and works offline.</p>

    <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; color: {{chipFg}}; background: {{chipBg}}">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: {{chipFg}}"></div>{{statusLabel}}
    </div>
  </div>

  <div style="background: rgba(255,255,255,0.46); backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); border: 1px solid rgba(255,255,255,0.78); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 10px 30px rgba(40,52,100,0.08); border-radius: 22px; padding: 4px 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid rgba(28,33,64,0.08); font-size: 14px"><div style="color: #465071">Model</div><div style="font-weight: 700">MIRA Core · compact</div></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid rgba(28,33,64,0.08); font-size: 14px"><div style="color: #465071">Download size</div><div style="font-weight: 700">1.8 GB</div></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid rgba(28,33,64,0.08); font-size: 14px"><div style="color: #465071">Free space</div><div style="font-weight: 700">23.4 GB available</div></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 0; font-size: 14px"><div style="color: #465071">This device</div><div style="display: flex; align-items: center; gap: 6px; font-weight: 700; color: #1F7A62"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>Compatible</div></div>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start; background: #FCF1E0; border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.45; color: #6B4510">
    <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
    <div>Wi-Fi recommended</div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{isIdle}}" hint-placeholder-val="{{ true }}">
      <button sc-camel-on-click="{{start}}" style="height: 56px; border: 0; border-radius: 18px; background: linear-gradient(180deg, #343F78 0%, #1C2245 100%); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 12px 28px rgba(40,52,100,0.32)"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Download model · 1.8 GB</button>
    </sc-if>
    <sc-if value="{{isDownloading}}" hint-placeholder-val="{{ false }}">
      <div style="height: 56px; border-radius: 18px; background: rgba(255,255,255,0.46); backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); border: 1px solid rgba(255,255,255,0.78); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 10px 30px rgba(40,52,100,0.08); padding: 0 16px; display: flex; flex-direction: column; justify-content: center; gap: 8px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}">
        <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><div>Downloading…</div><div style="color: #2E3A78">{{pct}}%</div></div>
        <div style="height: 6px; border-radius: 999px; background: rgba(222,228,250,0.85); overflow: hidden"><div style="height: 6px; border-radius: 999px; background: linear-gradient(90deg, #9DAAE6, #2E3A78); width: {{pctWidth}}"></div></div>
      </div>
    </sc-if>
    <sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}">
      <a href="Home.dc.html" style="height: 56px; border-radius: 18px; background: linear-gradient(180deg, #343F78 0%, #1C2245 100%); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 12px 28px rgba(40,52,100,0.32)">Finish setup</a>
    </sc-if>
    <a href="Home.dc.html" style="height: 52px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); color: #1C2140; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Continue with demo<span style="font-size: 11px; font-weight: 700; color: #8A5A12; background: #FCF1E0; padding: 3px 8px; border-radius: 999px">Simulated AI</span></a>

</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'idle', pct: 0 };
  }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
  renderVals() {
    const { phase, pct } = this.state;
    const status = {
      idle: { label: 'Not downloaded', fg: '#444C6C', bg: 'rgba(255,255,255,0.6)' },
      downloading: { label: 'Downloading · demo', fg: '#2E3A78', bg: 'rgba(222,228,250,0.85)' },
      ready: { label: 'Installed · ready offline', fg: '#1F7A62', bg: '#E3F5EF' }
    }[phase];
    return {
      orbMode: phase === 'downloading' ? 'thinking' : (phase === 'ready' ? 'offline' : 'idle'),
      isIdle: phase === 'idle', isDownloading: phase === 'downloading', isReady: phase === 'ready',
      statusLabel: status.label, chipFg: status.fg, chipBg: status.bg,
      ringColor: phase === 'ready' ? '#34A889' : '#BCC6EA',
      orbOpacity: phase === 'idle' ? 0.55 : 1,
      orbSat: phase === 'idle' ? 0.4 : 1,
      pct: pct, pctWidth: pct + '%',
      start: () => {
        this.setState({ phase: 'downloading', pct: 0 });
        this.timer = setInterval(() => {
          const next = Math.min(100, this.state.pct + 7);
          if (next >= 100) { clearInterval(this.timer); this.setState({ phase: 'ready', pct: 100 }); }
          else this.setState({ pct: next });
        }, 180);
      }
    };
  }
}
</script>
