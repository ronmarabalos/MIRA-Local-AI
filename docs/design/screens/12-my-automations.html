.m-tilt{animation:m-tilt 1.5s ease-in-out infinite alternate}

@media (prefers-reduced-motion: reduce){.m-breathe,.m-blink,.m-swell,.m-lvl,.m-scan,.m-tilt,.m-nod{animation:none!important}}
</style>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1300}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      filter: 'all', q: '', open: 'a1', confirm: null,
      list: [
        { id: 'a1', name: 'Draft routine email replies', desc: 'When a routine meeting request arrives, prepare a reply draft.', on: true, last: 'Last ran 8:50 AM', runs: 14, icon: 'M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM4 7l8 6 8-6', iconBg: 'rgba(222,228,250,0.85)', iconFg: '#2E3A78' },
        { id: 'a2', name: 'Daily morning planning', desc: 'Every day at 7:30 AM, prepare today’s plan.', on: true, last: 'Today 7:30 AM', runs: 32, icon: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5', iconBg: '#FCF1E0', iconFg: '#8A5A12' },
        { id: 'a3', name: 'Weekly task review', desc: 'Sundays at 6 PM, list unfinished tasks for review.', on: false, last: 'Last ran Sun 4 Oct', runs: 5, icon: 'M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM8 3v4M16 3v4M3 11h18', iconBg: '#E2F6F3', iconFg: '#1E7F73' },
        { id: 'a4', name: 'Deadline reminder', desc: 'One day before a task is due, remind me.', on: true, last: 'Yesterday 9:00 AM', runs: 9, icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2', iconBg: '#FBE9EB', iconFg: '#B23A4A' }
      ]
    };
  }
  renderVals() {
    const st = this.state;
    const ok = { icon: 'm5 12 5 5 9-10', bg: '#E3F5EF', fg: '#1F7A62' };
    const bad = { icon: 'M6 6l12 12M18 6 6 18', bg: '#FBE9EB', fg: '#B23A4A' };
    const hist = {
      a1: [Object.assign({ text: 'Drafted reply to Jordan Lee', time: '8:50 AM' }, ok), Object.assign({ text: 'Drafted reply to Sam Rivera', time: 'Yesterday' }, ok), Object.assign({ text: 'Couldn’t read email: offline', time: 'Tue' }, bad)],
      a2: [Object.assign({ text: 'Prepared today’s plan', time: '7:30 AM' }, ok), Object.assign({ text: 'Prepared plan', time: 'Yesterday' }, ok)],
      a3: [Object.assign({ text: 'Listed 4 open tasks', time: 'Sun 4 Oct' }, ok)],
      a4: [Object.assign({ text: 'Reminded: Pay electricity bill', time: 'Yesterday' }, ok)]
    };
    const vis = st.list.filter((a) => (st.filter === 'all' || (st.filter === 'active' ? a.on : !a.on)) && a.name.toLowerCase().indexOf(st.q.toLowerCase()) >= 0);
    const activeN = st.list.filter((a) => a.on).length;
    const upd = (id, patch) => this.setState({ list: st.list.map((a) => (a.id === id ? Object.assign({}, a, patch) : a)) });
    return {
      q: st.q, setQ: (e) => this.setState({ q: e.target.value }),
      summary: activeN + ' active · ' + (st.list.length - activeN) + ' paused',
      filters: [['all', 'All'], ['active', 'Active'], ['paused', 'Paused']].map(([id, label]) => {
        const sel = st.filter === id;
        return { label, sel: sel ? 'true' : 'false', bg: sel ? '#1C2140' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#1C2140', border: sel ? '1px solid #1C2140' : '1px solid rgba(255,255,255,0.8)', pick: () => this.setState({ filter: id }) };
      }),
      items: vis.map((a) => {
        const open = st.open === a.id;
        return Object.assign({}, a, {
          onStr: a.on ? 'true' : 'false', track: a.on ? '#2E3A78' : '#B9C0D6', align: a.on ? 'flex-end' : 'flex-start',
          status: a.on ? 'Active' : 'Paused', chipFg: a.on ? '#1F7A62' : '#444C6C', chipBg: a.on ? '#E3F5EF' : 'rgba(255,255,255,0.6)',
          dim: a.on ? 1 : 0.85,
          open: open, openStr: open ? 'true' : 'false',
          history: hist[a.id],
          confirming: st.confirm === a.id, notConfirming: st.confirm !== a.id,
          toggle: () => upd(a.id, { on: !a.on }),
          expand: () => this.setState({ open: open ? null : a.id, confirm: null }),
          askDelete: () => this.setState({ confirm: a.id }),
          cancelDelete: () => this.setState({ confirm: null }),
          doDelete: () => this.setState({ list: st.list.filter((x) => x.id !== a.id), confirm: null })
        });
      })
    };
  }
}
</script>
