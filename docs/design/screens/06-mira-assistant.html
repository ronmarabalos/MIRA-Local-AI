body{margin:0}

@keyframes mira-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}

.mira-breathe{animation:mira-breathe 3.5s ease-in-out infinite}
.mira-spin{animation:mira-spin 2.4s linear infinite}

.m-breathe{animation:m-breathe 4s ease-in-out infinite}

.m-blink{animation:m-blink 15s linear infinite}

.m-lvl{animation:m-lvl 3.2s ease-in-out infinite;transform-origin:50% 50%}
@keyframes m-lvl{0%{transform:scaleY(.25)}8%{transform:scaleY(.7)}16%{transform:scaleY(.45)}26%{transform:scaleY(1)}36%{transform:scaleY(.5)}46%{transform:scaleY(.85)}56%{transform:scaleY(.35)}64%{transform:scaleY(.75)}74%,100%{transform:scaleY(.18)}}

@keyframes m-scan{from{transform:translateX(0)}to{transform:translateX(14px)}}
.m-tilt{animation:m-tilt 1.5s ease-in-out infinite alternate}
@keyframes m-tilt{from{transform:rotate(0deg)}to{transform:rotate(3deg)}}
.m-nod{animation:m-nod 6s ease-out infinite}
@keyframes m-nod{0%,3.3%{transform:translateY(0) rotate(0deg)}5.4%{transform:translateY(1.9%) rotate(1.5deg)}7.5%,100%{transform:translateY(0) rotate(0deg)}}
@media (prefers-reduced-motion: reduce){.m-breathe,.m-blink,.m-swell,.m-lvl,.m-scan,.m-tilt,.m-nod{animation:none!important}}
</style>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '', thinking: false, reminder: 'pending',
      messages: [
        { kind: 'user', text: 'Remind me to submit my report tomorrow.', time: '8:30 AM' },
        { kind: 'mira', text: 'Of course! What time would you like me to remind you?', time: '8:30 AM' },
        { kind: 'user', text: '8 AM, before the deadline.', time: '8:31 AM' },
        { kind: 'mira', text: 'Confirm to create it.', time: '8:31 AM' },
        { kind: 'card' }
      ]
    };
  }
  componentWillUnmount() { if (this.t) clearTimeout(this.t); if (this.t2) clearTimeout(this.t2); }
  now() {
    const d = new Date();
    let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0');
    const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    return h + ':' + m + ' ' + ap;
  }
  reply(userText, miraMsg) {
    const msgs = this.state.messages.filter((x) => x.kind !== 'chips').concat([{ kind: 'user', text: userText, time: this.now() }]);
    this.setState({ messages: msgs, thinking: true, listening: false, draft: '' });
    this.t = setTimeout(() => {
      this.setState({ thinking: false, responding: true, messages: this.state.messages.concat([Object.assign({ time: this.now() }, miraMsg)]) });
      this.t2 = setTimeout(() => this.setState({ responding: false }), 2600);
    }, 1400);
  }
  send() {
    const text = (this.state.draft || '').trim();
    if (!text) return;
    this.reply(text, { kind: 'mira', text: '(Demo) Got it.' });
  }
  renderVals() {
    const st = this.state;
    const followUps = {
      kind: 'chips',
      chips: [
        { label: 'Email Priya the draft', pick: () => this.reply('Email Priya the report draft too.', { kind: 'error', text: 'You’re offline. I saved a draft and will ask before sending.' }) },
        { label: 'Block focus time', pick: () => this.reply('Block focus time this afternoon.', { kind: 'mira', text: 'You’re free 2–4 PM. Add a focus block?' }) }
      ]
    };
    const msgs = st.messages.slice();
    const last = msgs[msgs.length - 1];
    if (st.reminder === 'done' && !st.thinking && last.kind === 'mira' && last.doneNote) msgs.push(followUps);
    const has = !!(st.draft || '').trim();
    return {
      statusText: st.thinking ? 'Thinking on device' : (st.listening ? 'Listening' : 'Running on device'),
      miraMode: st.thinking ? 'thinking' : (st.listening ? 'listening' : (st.responding ? 'responding' : 'idle')),
      listenStr: st.listening ? 'true' : 'false', micBg: st.listening ? 'rgba(46,58,120,0.12)' : 'transparent',
      toggleListen: () => this.setState({ listening: !st.listening }),
      thinking: st.thinking, notThinking: !st.thinking,
      draft: st.draft, empty: !has, hasText: has,
      setDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') this.send(); },
      send: () => this.send(),
      stop: () => { if (this.t) clearTimeout(this.t); this.setState({ thinking: false }); },
      starters: [
        { label: 'Plan my afternoon', icon: 'M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM8 3v4M16 3v4M3 11h18', pick: () => this.reply('Plan my afternoon.', { kind: 'mira', text: 'Q3 report first, then reply to Sam before 6 PM.' }) },
