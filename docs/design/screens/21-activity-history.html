<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>MIRA · Activity history</title>
<script src="78826311-dd63-4e35-8012-94ee7ba6983a"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0}
a{color:#2E3A78;text-decoration:none}a:hover{color:#232C5E}
button{font-family:inherit;cursor:pointer}
@keyframes mira-spin{to{transform:rotate(360deg)}}
.mira-spin{animation:mira-spin 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){.mira-spin{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 1400px; position: relative; overflow: hidden; box-sizing: border-box; padding: 52px 20px 40px; display: flex; flex-direction: column; gap: 16px; font-family: 'Onest', 'Segoe UI', system-ui, sans-serif; color: #1C2140; background: linear-gradient(180deg, #A7B2CE 0%, #C3CBDF 30%, #DCE0EC 62%, #E9ECF3 100%); isolation: isolate">
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none">
    <div style="position: absolute; width: 560px; height: 360px; left: -150px; top: -90px; border-radius: 50%; background: radial-gradient(ellipse at 55% 60%, rgba(92,106,150,0.55) 0%, rgba(92,106,150,0) 66%); filter: blur(28px); transform: rotate(-16deg)"></div>
    <div style="position: absolute; width: 260px; height: 640px; right: -40px; top: -180px; border-radius: 50%; background: linear-gradient(100deg, rgba(255,255,255,0) 18%, rgba(255,255,255,0.9) 47%, rgba(255,255,255,0) 72%); filter: blur(16px); transform: rotate(28deg)"></div>
    <div style="position: absolute; width: 180px; height: 520px; left: 120px; top: -160px; border-radius: 50%; background: linear-gradient(95deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 78%); filter: blur(22px); transform: rotate(-30deg)"></div>
    <div style="position: absolute; width: 420px; height: 260px; right: -160px; top: 260px; border-radius: 50%; background: conic-gradient(from 120deg, rgba(255,190,214,0.35), rgba(196,206,255,0.35), rgba(176,236,226,0.32), rgba(255,226,196,0.3), rgba(255,190,214,0.35)); filter: blur(46px)"></div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Profile.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.46); backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); border: 1px solid rgba(255,255,255,0.78); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 10px 30px rgba(40,52,100,0.08); color: #1C2140; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></a>
    <button sc-camel-on-click="{{cycleRange}}" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); color: #1C2140; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="#2E3A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>{{rangeLabel}}</button>
  </div>

  <header style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -0.03em">Activity</h1>
  </header>

  <div role="tablist" aria-label="Status filter" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
      <button role="tab" aria-selected="{{f.sel}}" sc-camel-on-click="{{f.pick}}" style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 700; border: {{f.border}}; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <sc-if value="{{r.head}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #444C6C; padding: 10px 0 10px 2px">{{r.day}}</div></sc-if>
      <div style="display: flex; gap: 12px">
        <div style="display: flex; flex-direction: column; align-items: center; width: 34px; flex-shrink: 0">
          <div style="width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: {{r.bg}}; color: {{r.fg}}; border: {{r.ring}}">
            <sc-if value="{{r.spin}}" hint-placeholder-val="{{ false }}"><div class="mira-spin" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #C9D1EC; border-top-color: #2E3A78"></div></sc-if>
            <sc-if value="{{r.still}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></sc-if>
          </div>
          <div style="flex: 1; width: 2px; min-height: 12px; background: #CDD4EB"></div>
        </div>
        <div style="flex: 1; min-width: 0; padding-bottom: 12px">
          <button sc-camel-on-click="{{r.toggle}}" aria-expanded="{{r.openStr}}" style="width: 100%; background: rgba(255,255,255,0.46); backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); border: 1px solid rgba(255,255,255,0.78); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 10px 30px rgba(40,52,100,0.08); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; color: #1C2140">
            <div style="display: flex; justify-content: space-between; gap: 8px; align-items: flex-start"><div style="font-size: 14px; font-weight: 700; line-height: 1.35">{{r.title}}</div><div style="font-size: 12px; color: #515A7A; flex-shrink: 0">{{r.time}}</div></div>
            <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><div style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; color: {{r.fg}}; background: {{r.bg}}">{{r.label}}</div><div style="font-size: 12px; color: #465071">{{r.source}}</div></div>
            <sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
              <div style="margin-top: 4px; border-top: 1px solid rgba(28,33,64,0.08); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
                <div style="display: flex; justify-content: space-between; gap: 10px"><div style="color: #465071">Result</div><div style="font-weight: 700; text-align: right">{{r.result}}</div></div>
                <div style="display: flex; justify-content: space-between; gap: 10px"><div style="color: #465071">Approval required</div><div style="font-weight: 700">{{r.approval}}</div></div>
                <div style="display: flex; justify-content: space-between; gap: 10px"><div style="color: #465071">App</div><div style="font-weight: 700">{{r.app}}</div></div>
              </div>
            </sc-if>
          </button>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="border: 1.5px dashed #C9D1EC; border-radius: 20px; padding: 24px; text-align: center; font-size: 14px; color: #465071">No activity matches this filter.</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1400}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', range: 0, open: 'r3' };
  }
  renderVals() {
    const st = this.state;
    const S = {
      suggested: ['Suggested', '#2E3A78', '#FFFFFF', '1.5px dashed #9DAAE6', 'M12 5v14M5 12h14'],
      awaiting: ['Awaiting approval', '#8A5A12', '#FCF1E0', '0', 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6zM12 9v3M12 15h.01'],
      queued: ['Queued', '#444C6C', 'rgba(255,255,255,0.6)', '0', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2'],
      processing: ['Processing', '#232C5E', 'rgba(222,228,250,0.85)', '0', ''],
      completed: ['Completed', '#1F7A62', '#E3F5EF', '0', 'm5 12 5 5 9-10'],
      failed: ['Failed', '#B23A4A', '#FBE9EB', '0', 'M6 6l12 12M18 6 6 18']
    };
    const all = [
      { id: 'r1', day: 'TODAY', title: 'Summarizing Priya’s email', time: 'Now', s: 'processing', source: 'You asked', result: 'In progress on device', approval: 'No', app: 'Demo mailbox' },
      { id: 'r2', day: 'TODAY', title: 'Calendar refresh', time: '9:12 AM', s: 'failed', source: 'Scheduled sync', result: 'No connection · retry queued', approval: 'No', app: 'Demo calendar' },
      { id: 'r3', day: 'TODAY', title: 'Drafted reply to Jordan Lee', time: '8:50 AM', s: 'completed', source: 'Draft routine email replies', result: 'Draft saved · not sent', approval: 'No (drafts only)', app: 'Demo mailbox' },
      { id: 'r4', day: 'TODAY', title: 'Send reply to Maya Chen', time: '8:44 AM', s: 'awaiting', source: 'Draft routine email replies', result: 'Waiting for you', approval: 'Yes', app: 'Demo mailbox' },
      { id: 'r5', day: 'TODAY', title: 'Created reminder: Submit Q3 report', time: '8:31 AM', s: 'completed', source: 'You confirmed in chat', result: 'Reminder set for Sat 8:00 AM', approval: 'Yes · you confirmed', app: 'This device' },
      { id: 'r6', day: 'TODAY', title: 'Proposed “Sunday week planning”', time: '7:31 AM', s: 'suggested', source: 'Noticed a routine', result: 'Not active', approval: 'Yes', app: 'This device' },
      { id: 'r7', day: 'TODAY', title: 'Prepared today’s plan', time: '7:30 AM', s: 'completed', source: 'Daily morning planning', result: '3 tasks, 2 events', approval: 'No', app: 'This device' },
      { id: 'r8', day: 'YESTERDAY', title: 'Send reply to Sam Rivera', time: '9:10 PM', s: 'queued', source: 'You approved offline', result: 'Waits for connection', approval: 'Yes · re-confirm online', app: 'Demo mailbox' }
    ];
    const filters = [['all', 'All'], ['needs', 'Needs you'], ['queued', 'Queued'], ['completed', 'Completed'], ['failed', 'Failed']];
    const match = (r) => st.filter === 'all' || (st.filter === 'needs' ? (r.s === 'awaiting' || r.s === 'suggested') : r.s === st.filter);
    const ranges = ['Today & yesterday', 'Today', 'This week'];
    const inRange = (r) => st.range !== 1 || r.day === 'TODAY';
    const vis = all.filter((r) => match(r) && inRange(r));
    let last = null;
    return {
      rangeLabel: ranges[st.range],
      cycleRange: () => this.setState({ range: (st.range + 1) % ranges.length }),
      filters: filters.map(([id, label]) => {
        const sel = st.filter === id;
        return { label, sel: sel ? 'true' : 'false', bg: sel ? '#1C2140' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#1C2140', border: sel ? '1px solid #1C2140' : '1px solid rgba(255,255,255,0.8)', pick: () => this.setState({ filter: id }) };
      }),
      empty: vis.length === 0,
      rows: vis.map((r) => {
        const s = S[r.s];
        const head = r.day !== last; last = r.day;
        const open = st.open === r.id;
        return Object.assign({}, r, {
          head, label: s[0], fg: s[1], bg: s[2], ring: s[3], icon: s[4],
          spin: r.s === 'processing', still: r.s !== 'processing',
          open, openStr: open ? 'true' : 'false',
          toggle: () => this.setState({ open: open ? null : r.id })
        });
      })
    };
  }
}
</script>


</body></html>
