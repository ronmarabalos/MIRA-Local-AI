<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1300}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all', open: 'e1' };
  }
  renderVals() {
    const { tab, open } = this.state;
    const all = [
      { id: 'e1', from: 'Maya Chen', subject: 'Can we reschedule our meeting?', preview: 'Hi Alex, something came up on Thursday. Could we move our 1:1 to early next week?', time: '8:42 AM', unread: true, high: true, label: 'Needs reply', cats: ['priority', 'reply'], fresh: true, avBg: '#FBE9EB', avFg: '#B23A4A' },
      { id: 'e2', from: 'Priya Nair', subject: 'Q3 report: final numbers', preview: 'Attached the final revenue table. Can you fold it into the report before tomorrow?', time: '8:15 AM', unread: true, high: true, label: 'Deadline tomorrow', cats: ['priority'], fresh: true, avBg: '#E2F6F3', avFg: '#1E7F73' },
      { id: 'e3', from: 'Sam Rivera', subject: 'Dinner Saturday?', preview: 'Are we still on for 7:30? I can book the Thai place on Elm.', time: 'Yesterday', unread: false, high: false, label: 'Draft saved', cats: ['reply', 'drafts'], fresh: false, avBg: '#FCF1E0', avFg: '#8A5A12' },
      { id: 'e4', from: 'Jordan Lee', subject: 'Weekly sync notes', preview: 'Notes from today’s sync, plus the three action items we agreed on.', time: 'Yesterday', unread: false, high: false, label: 'Summarized', cats: ['handled'], fresh: false, avBg: 'rgba(222,228,250,0.85)', avFg: '#2E3A78' },
      { id: 'e5', from: 'City Utilities', subject: 'Your October bill is ready', preview: 'Your bill of $64.20 is due on 20 October.', time: 'Yesterday', unread: false, high: false, label: 'Task created', cats: ['handled'], fresh: false, avBg: 'rgba(255,255,255,0.6)', avFg: '#444C6C' },
      { id: 'e6', from: 'Lumen Design Weekly', subject: '5 patterns for calmer interfaces', preview: 'This week: progressive disclosure, quiet defaults, and more.', time: 'Mon', unread: false, high: false, label: 'Newsletter', cats: [], fresh: false, avBg: 'rgba(255,255,255,0.6)', avFg: '#444C6C' }
    ];
    const defs = [
      { id: 'all', label: 'All' }, { id: 'priority', label: 'Priority' }, { id: 'reply', label: 'Needs Reply' },
      { id: 'drafts', label: 'Drafts' }, { id: 'handled', label: 'Handled by MIRA' }
    ];
    const match = (e, t) => t === 'all' || e.cats.indexOf(t) >= 0;
    const list = all.filter((e) => match(e, tab));
    let lastFresh = null;
    return {
      tabs: defs.map((d) => {
        const sel = d.id === tab;
        return {
          label: d.label, count: all.filter((e) => match(e, d.id)).length, sel: sel ? 'true' : 'false',
          bg: sel ? '#1C2140' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#1C2140', border: sel ? '1px solid #1C2140' : '1px solid rgba(255,255,255,0.8)',
          pick: () => this.setState({ tab: d.id })
        };
      }),
      empty: list.length === 0,
      emails: list.map((e) => {
        const showDivider = e.fresh !== lastFresh;
        lastFresh = e.fresh;
        const isOpen = open === e.id;
        return Object.assign({}, e, {
          initial: e.from[0],
          weight: e.unread ? '800' : '600',
          cardBorder: e.unread ? '#C9D1EC' : 'rgba(255,255,255,0.8)',
          showDivider: showDivider,
          divider: e.fresh ? 'New' : 'Earlier · saved offline',
          dividerIcon: e.fresh ? 'M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4' : 'M7 3h10v18H7zM11 18h2',
          open: isOpen, openStr: isOpen ? 'true' : 'false',
          chev: isOpen ? 'm6 15 6-6 6 6' : 'm6 9 6 6 6-6',
          toggle: () => this.setState({ open: isOpen ? null : e.id })
        });
      })
    };
  }
}
</script>
