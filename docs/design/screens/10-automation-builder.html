<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1500}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { desc: 'When a routine meeting request arrives, prepare a reply draft for me.', working: false, proposed: true, trigger: 0, action: 0, level: 0, conds: [true, false] };
  }
  componentWillUnmount() { if (this.t) clearTimeout(this.t); }
  renderVals() {
    const st = this.state;
    const pill = (sel) => ({ sel: sel ? 'true' : 'false', bg: sel ? 'rgba(222,228,250,0.85)' : '#FFFFFF', fg: sel ? '#232C5E' : '#1C2140', border: sel ? '1.5px solid #6A79CF' : '1px solid rgba(255,255,255,0.8)' });
    const trig = ['An email arrives', 'A time of day', 'A task is due'];
    const acts = ['Prepare a reply draft', 'Remind me', 'Create a task'];
    const condLabels = ['It’s a routine meeting request', 'Sender is in my contacts'];
    const lv = [
      { label: 'Prepare only', hint: 'MIRA drafts, you decide' },
      { label: 'Ask before acting', hint: 'Asks every time' },
      { label: 'Act automatically', hint: 'Not for email', disabled: true }
    ];
    return {
      desc: st.desc, working: st.working, proposed: st.proposed,
      proposeLabel: st.working ? 'Drafting a rule…' : 'Propose a rule',
      setDesc: (e) => this.setState({ desc: e.target.value }),
      propose: () => {
        this.setState({ working: true, proposed: false });
        this.t = setTimeout(() => this.setState({ working: false, proposed: true, trigger: 0, action: 0, conds: [true, false] }), 1000);
      },
      triggerText: trig[st.trigger], actionText: acts[st.action],
      triggers: trig.map((l, i) => Object.assign({ label: l, pick: () => this.setState({ trigger: i }) }, pill(i === st.trigger))),
      actions: acts.map((l, i) => Object.assign({ label: l, pick: () => this.setState({ action: i }) }, pill(i === st.action))),
      conds: condLabels.map((l, i) => {
        const on = st.conds[i];
        return { label: l, onStr: on ? 'true' : 'false', track: on ? '#2E3A78' : '#B9C0D6', align: on ? 'flex-end' : 'flex-start', toggle: () => { const c = st.conds.slice(); c[i] = !c[i]; this.setState({ conds: c }); } };
      }),
      levels: lv.map((l, i) => {
        const sel = i === st.level;
        return {
          label: l.label, hint: l.hint, sel: sel ? 'true' : 'false', disabled: !!l.disabled,
          bg: sel ? 'rgba(255,255,255,0.55)' : '#FFFFFF', border: sel ? '1.5px solid #6A79CF' : '1px solid rgba(255,255,255,0.8)',
          dot: sel ? '6px solid #2E3A78' : '2px solid #BCC6EA', opacity: l.disabled ? 0.55 : 1,
          pick: () => { if (!l.disabled) this.setState({ level: i }); }
        };
      })
    };
  }
}
</script>
