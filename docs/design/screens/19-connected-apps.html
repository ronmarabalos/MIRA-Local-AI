<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>MIRA · Connected apps</title>
<script src="912b8a37-ceb9-4e44-8a69-948800428db8"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0}
a{color:#2E3A78;text-decoration:none}a:hover{color:#232C5E}
button{font-family:inherit;cursor:pointer}
@keyframes mira-up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.mira-up{animation:mira-up .3s ease-out both}
@media (prefers-reduced-motion:reduce){.mira-up{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 1150px; position: relative; overflow: hidden; box-sizing: border-box; padding: 52px 20px 40px; display: flex; flex-direction: column; gap: 16px; font-family: 'Onest', 'Segoe UI', system-ui, sans-serif; color: #1C2140; background: linear-gradient(180deg, #A7B2CE 0%, #C3CBDF 30%, #DCE0EC 62%, #E9ECF3 100%); isolation: isolate">
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none">
    <div style="position: absolute; width: 560px; height: 360px; left: -150px; top: -90px; border-radius: 50%; background: radial-gradient(ellipse at 55% 60%, rgba(92,106,150,0.55) 0%, rgba(92,106,150,0) 66%); filter: blur(28px); transform: rotate(-16deg)"></div>
    <div style="position: absolute; width: 260px; height: 640px; right: -40px; top: -180px; border-radius: 50%; background: linear-gradient(100deg, rgba(255,255,255,0) 18%, rgba(255,255,255,0.9) 47%, rgba(255,255,255,0) 72%); filter: blur(16px); transform: rotate(28deg)"></div>
    <div style="position: absolute; width: 180px; height: 520px; left: 120px; top: -160px; border-radius: 50%; background: linear-gradient(95deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 78%); filter: blur(22px); transform: rotate(-30deg)"></div>
    <div style="position: absolute; width: 420px; height: 260px; right: -160px; top: 260px; border-radius: 50%; background: conic-gradient(from 120deg, rgba(255,190,214,0.35), rgba(196,206,255,0.35), rgba(176,236,226,0.32), rgba(255,226,196,0.3), rgba(255,190,214,0.35)); filter: blur(46px)"></div>
  </div>

  <div style="display: flex; align-items: center">
    <a href="Profile.dc.html" aria-label="Back to Profile" style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.46); backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); border: 1px solid rgba(255,255,255,0.78); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 10px 30px rgba(40,52,100,0.08); color: #1C2140; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></a>
  </div>

  <header style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -0.03em">Connected Apps</h1>
    <div style="font-size: 15px; color: #465071">Choose what MIRA can access.</div>
  </header>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="6">
      <sc-if value="{{a.head}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #444C6C; padding: 6px 2px 0">{{a.headText}}</div></sc-if>
      <button sc-camel-on-click="{{a.open}}" style="width: 100%; background: rgba(255,255,255,0.46); backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); border: 1px solid rgba(255,255,255,0.78); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 10px 30px rgba(40,52,100,0.08); border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 12px; text-align: left; color: #1C2140">
        <div style="width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; background: {{a.bg}}; color: {{a.fg}}">{{a.mono}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 15px; font-weight: 700">{{a.name}}</div>
          <div style="display: flex; align-items: center; gap: 6px"><div style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; display: flex; align-items: center; gap: 4px; color: {{a.sFg}}; background: {{a.sBg}}"><svg width="11" height="11" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.sIcon}}"></path></svg>{{a.status}}</div></div>
          <div style="font-size: 12px; color: #515A7A; line-height: 1.4">{{a.note}}</div>
        </div>
        <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#515A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 10; background: rgba(28,33,64,0.42); display: flex; flex-direction: column; justify-content: flex-end">
      <div class="mira-up" role="dialog" aria-label="{{cur.name}} permissions" style="background: rgba(238,241,249,0.86); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); border: 1px solid rgba(255,255,255,0.9); border-radius: 32px 32px 0 0; padding: 12px 20px 36px; display: flex; flex-direction: column; gap: 16px">
        <div style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #B9C0D6"></div>
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; background: {{cur.bg}}; color: {{cur.fg}}">{{cur.mono}}</div>
          <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 19px; font-weight: 700">{{cur.name}}</div><div style="font-size: 12px; font-weight: 700; color: {{cur.sFg}}">{{cur.status}}</div></div>
        </div>
        <div style="font-size: 14px; line-height: 1.5; color: #343B5C">{{cur.why}}</div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{perms}}" as="p" hint-placeholder-count="4">
            <button sc-camel-on-click="{{p.toggle}}" role="switch" aria-checked="{{p.onStr}}" disabled="{{p.locked}}" style="min-height: 58px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); padding: 8px 12px 8px 14px; display: flex; align-items: center; gap: 12px; text-align: left; opacity: {{p.opacity}}">
              <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 14px; font-weight: 700; color: #1C2140">{{p.label}}</div><div style="font-size: 12px; color: #465071">{{p.hint}}</div></div>
              <div style="width: 52px; height: 32px; flex-shrink: 0; border-radius: 999px; padding: 3px; box-sizing: border-box; display: flex; justify-content: {{p.align}}; background: {{p.track}}"><div style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(28,33,64,0.2)"></div></div>
            </button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8px">
          <button sc-camel-on-click="{{close}}" style="flex: 1; height: 52px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); color: #1C2140; font-size: 15px; font-weight: 700">Done</button>
          <button sc-camel-on-click="{{primary}}" style="flex: 1; height: 52px; border: 0; border-radius: 16px; font-size: 15px; font-weight: 700; background: {{cur.btnBg}}; color: {{cur.btnFg}}">{{cur.btn}}</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1150}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      open: null,
      status: { local: 'connected', demo: 'offline', gmail: 'none', gcal: 'none', outlook: 'reauth', other: 'none' },
      perms: { local: [true, true, false, false], demo: [true, true, false, false] }
    };
  }
  renderVals() {
    const st = this.state;
    const S = {
      connected: ['Connected', '#1F7A62', '#E3F5EF', 'm5 12 5 5 9-10'],
      none: ['Not connected', '#444C6C', 'rgba(255,255,255,0.6)', 'M12 5v14M5 12h14'],
      reauth: ['Needs reauthorization', '#8A5A12', '#FCF1E0', 'M12 8v5M12 16h.01'],
      offline: ['Offline · sync unavailable', '#444C6C', 'rgba(255,255,255,0.6)', 'M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0']
    };
    const defs = [
      { id: 'local', name: 'This device', mono: 'D', bg: '#1C2140', fg: '#FFFFFF', note: 'Notifications, local files and storage', group: 'ON YOUR PHONE', why: 'MIRA uses your phone for reminders, local files you attach and on-device memory.' },
      { id: 'demo', name: 'Demo mailbox & calendar', mono: 'S', bg: 'rgba(222,228,250,0.85)', fg: '#2E3A78', note: 'Sample data · not live', group: 'DEMO DATA', why: 'Sample emails and events so you can try MIRA safely. Nothing here is a real account.' },
      { id: 'gmail', name: 'Gmail', mono: 'G', bg: '#FBE9EB', fg: '#B23A4A', note: 'Read, sort and draft replies', group: 'EMAIL & CALENDAR', why: 'Connect to let MIRA read your inbox and prepare drafts. You choose each permission.' },
      { id: 'gcal', name: 'Google Calendar', mono: 'C', bg: '#E2F6F3', fg: '#1E7F73', note: 'See events and suggest changes' },
      { id: 'outlook', name: 'Outlook', mono: 'O', bg: '#E8EEFB', fg: '#2F55A4', note: 'Sign in again to keep syncing' },
      { id: 'other', name: 'Other compatible services', mono: '+', bg: 'rgba(255,255,255,0.6)', fg: '#444C6C', note: 'Browse supported apps', group: 'MORE' }
    ];
    const permDefs = [
      { label: 'Read information', hint: 'See emails, events or files' },
      { label: 'Create drafts', hint: 'Prepare things for you to review' },
      { label: 'Change information', hint: 'Edit events, labels or files' },
      { label: 'Send or perform actions', hint: 'Always asks you first' }
    ];
    const mk = (d) => {
      const s = S[st.status[d.id]];
      return Object.assign({}, d, {
        status: s[0], sFg: s[1], sBg: s[2], sIcon: s[3],
        head: !!d.group, headText: d.group || '',
        why: d.why || 'Connect to choose what MIRA can see and do. You can revoke access any time.',
        open: () => this.setState({ open: d.id })
      });
    };
    const apps = defs.map(mk);
    const cur = st.open ? apps.find((a) => a.id === st.open) : null;
    const curStatus = cur ? st.status[cur.id] : null;
    const on = cur && st.perms[cur.id] ? st.perms[cur.id] : [false, false, false, false];
    const live = curStatus === 'connected' || curStatus === 'offline';
    let btn = 'Connect', btnBg = 'linear-gradient(180deg, #343F78 0%, #1C2245 100%)', btnFg = '#FFFFFF';
    if (curStatus === 'reauth') btn = 'Sign in again';
    if (live) { btn = cur && cur.id === 'demo' ? 'Remove demo data' : 'Disconnect'; btnBg = '#FBE9EB'; btnFg = '#B23A4A'; }
    return {
      apps, sheet: !!cur,
      cur: cur ? Object.assign({}, cur, { btn, btnBg, btnFg }) : { name: '', mono: '', bg: '', fg: '', status: '', sFg: '', why: '', btn: '', btnBg: '', btnFg: '' },
      perms: permDefs.map((p, i) => {
        const v = on[i];
        const locked = !live;
        return Object.assign({}, p, {
          onStr: v ? 'true' : 'false', locked: locked, opacity: locked ? 0.5 : 1,
          track: v ? '#2E3A78' : '#B9C0D6', align: v ? 'flex-end' : 'flex-start',
          toggle: () => { if (locked) return; const n = Object.assign({}, st.perms); n[cur.id] = on.slice(); n[cur.id][i] = !v; this.setState({ perms: n }); }
        });
      }),
      close: () => this.setState({ open: null }),
      primary: () => {
        if (!cur) return;
        const s = Object.assign({}, st.status);
        if (live) { s[cur.id] = 'none'; this.setState({ status: s, open: null }); }
        else this.setState({ open: null });
      }
    };
  }
}
</script>


</body></html>
